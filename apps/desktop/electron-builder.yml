appId: com.octoai.desktop
productName: OctoAI
directories:
  buildResources: resources
  output: dist/release
files:
  - dist/main/**/*
  - dist/renderer/**/*
  - package.json
  - "!node_modules/**/{test,tests,__tests__,spec}/**"
  - "!node_modules/.cache"
npmRebuild: true
buildDependenciesFromSource: false
extraResources:
  - from: ../../node_modules/node-pty
    to: node_modules/node-pty
  - from: ../../node_modules/better-sqlite3
    to: node_modules/better-sqlite3
mac:
  icon: resources/icon.icns
  category: public.app-category.developer-tools
  artifactName: OctoAI.dmg
  target:
    - dmg
    - zip
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
win:
  icon: resources/icon.ico
  artifactName: OctoAI-Setup.exe
  target:
    - nsis
linux:
  icon: resources/icon.icns
  artifactName: OctoAI.AppImage
  target:
    - AppImage
