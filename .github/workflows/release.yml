name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: cd apps/desktop && npx electron-rebuild -f -w node-pty,better-sqlite3

      - name: Build & package
        run: cd apps/desktop && npm run package:mac

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/release/*.dmg
            apps/desktop/dist/release/*.zip

  release-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild native modules for Electron
        run: cd apps/desktop && npx electron-rebuild -f -w node-pty,better-sqlite3

      - name: Build & package
        run: cd apps/desktop && npm run package:win

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/desktop/dist/release/*.exe
            apps/desktop/dist/release/*.zip
